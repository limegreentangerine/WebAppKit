name: DevTests

on:
    push:
        branches:
            - develop
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Run tests
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Run tests
              run: composer test
