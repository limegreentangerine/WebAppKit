name: Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: composer test

  trigger-downstream:
    name: Trigger downstream workflow
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch downstream repository event
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CROSS_REPO_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'limegreentangerine',
              repo: 'packages.limegreentangerine.net',
              event_type: 'package-tests-passed',
              client_payload: {
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_ref: context.ref,
                source_sha: context.sha
              }
            });
